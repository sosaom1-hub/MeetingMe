name: MeetingRecorder

options:
  developmentLanguage: th
  deploymentTarget:
    iOS: "27.0"
    watchOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true

settings:
  base:
    # Change BUNDLE_PREFIX and set DEVELOPMENT_TEAM before installing on real devices.
    BUNDLE_PREFIX: com.sosaom1.meetingrecorder
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Shared/Assets.xcassets (iPhone + Watch). Source art: docs/brand/meetingme-icon.svg
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  MeetingRecorder:
    type: application
    platform: iOS
    sources:
      - MeetingRecorder
      - Shared
    info:
      path: MeetingRecorder/Info.plist
      properties:
        # Keeps recording when the iPhone screen locks.
        UIBackgroundModes: [audio]
        # Plain HTTP only to local/IP hosts (simulator → 127.0.0.1, Tailscale 100.x). Internet hosts still need HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: บันทึกประชุม
        INFOPLIST_KEY_NSMicrophoneUsageDescription: แอปใช้ไมโครโฟนเพื่อบันทึกเสียงประชุมเมื่อคุณกดเริ่มบันทึกเท่านั้น เสียงจะถูกเก็บไว้ในเครื่องของคุณ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    dependencies:
      - target: MeetingRecorder Watch App

  MeetingRecorder Watch App:
    type: application
    platform: watchOS
    sources:
      - MeetingRecorder Watch App
      - Shared
    info:
      path: MeetingRecorder Watch App/Info.plist
      properties:
        CFBundleDisplayName: บันทึกประชุม
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_PREFIX)
        NSMicrophoneUsageDescription: แอปใช้ไมโครโฟนเพื่อบันทึกเสียงประชุมเมื่อคุณกดเริ่มบันทึกเท่านั้น
        # R1: needed for recording to continue with the wrist down; confirmed or rejected in Task 2.
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).watchkitapp

  MeetingRecorder Server:
    type: application
    platform: macOS
    sources:
      - MeetingRecorder Mac
    info:
      path: MeetingRecorder Mac/Info.plist
      properties:
        CFBundleDisplayName: บันทึกประชุม Server
        # Menu bar only: no Dock icon.
        LSUIElement: true
        # Repository root, so the app finds mac-server/ and scripts/. Override with defaults key "repositoryPath".
        MRRepositoryPath: $(SRCROOT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).server
        # "Sign to Run Locally": never expires, needs no Apple account.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO

  MeetingRecorderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MeetingRecorderTests
    dependencies:
      - target: MeetingRecorder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MeetingRecorder.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MeetingRecorder
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  MeetingRecorder:
    build:
      targets:
        MeetingRecorder: all
    test:
      targets:
        - MeetingRecorderTests
  MeetingRecorder Watch App:
    build:
      targets:
        MeetingRecorder Watch App: all
  MeetingRecorder Server:
    build:
      targets:
        MeetingRecorder Server: all
